  if (seoul > 0) parts.push(`${seoul} 趟首尔追星`);
  if (stanley > 0) parts.push(`${stanley} 个 Stanley 杯`);
  if (diptyque > 0) parts.push(`${diptyque} 个 Diptyque 蜡烛`);
  if (westwood > 0) parts.push(`${westwood} 条西太后 choker`);

  // Pick top 3 most interesting
  const top3 = parts.slice(0, 3);

  const slogans = [
    top3.length > 0
      ? `${top3.join(' + ')}。还要继续吗？`
      : '这笔钱说多不多说少不少，但花在自己身上总能更聪明。',
    diptyque > 0
      ? `${diptyque} 个 Diptyque 蜡烛，每天点一个能点 ${(diptyque/365).toFixed(1)} 年。`
      : (lulu > 0
        ? `${lulu} 件 lululemon Define，每周一件能穿 ${(lulu/52).toFixed(1)} 年。`
        : (stanley > 0
          ? `${stanley} 个 Stanley 杯，送闺蜜每人一个还要送 ${Math.max(0,stanley-5)} 个。`
          : '冷静想想，这笔钱可以做很多事。')),
    top3.length > 0
      ? `＝ ${top3.join(' + ')}。你有这么多钱花给自己诶。`
      : '花在追星上是快乐，花在自己身上也是值得。',
  ];
  document.getElementById('summaryNumber').textContent = '¥' + currentAmount.toLocaleString();
  document.getElementById('summarySlogan').textContent = slogans[Math.floor(Math.random()*slogans.length)];
}

function renderFilter() {
  const cats = ['all','shopping','travel','beauty','health','food','mood','life'];
  if(customItems.length) cats.push('custom');
  document.getElementById('filterBar').innerHTML = cats.map(c =>
    `<button class="${c===currentFilter?'active':''}" onclick="switchFilter('${c}',this)">${catLabels[c]}</button>`
  ).join('');
}

function switchFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('#filterBar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList(cat);
}

function renderList(filter) {
  let all = [...items];
  customItems.forEach(ci => all.push({ e:ci.e||'💜', n:ci.n, p:ci.p, c:'custom' }));

  let list = filter==='all' ? all : all.filter(i => i.c===filter);
  list = list.map(i => ({...i, q:Math.floor(currentAmount/i.p), r:currentAmount%i.p}))
    .filter(i => i.q > 0)
    .sort((a,b) => b.q - a.q);

  const container = document.getElementById('resultList');
  if(!list.length) {
    container.innerHTML = '<div style="padding:40px 0;text-align:center;color:var(--text-tertiary);">这笔钱还不够买这个分类里的任何东西。</div>';
    return;
  }

  container.innerHTML = list.map(i => {
    const unit = i.c==='travel'?'趟':i.c==='food'?'顿':i.c==='mood'?'个':'个';
    const verb = i.c==='travel'?'可以去 ':'可以买 ';
    return `
    <div class="result-item">
      <span class="emoji">${i.e}</span>
      <div class="info">
        <div class="name">${i.n}</div>
        <div class="meta">¥${i.p.toLocaleString()} / ${unit}</div>
      </div>
      <div class="qty">
        <div class="num">${i.q.toLocaleString()}</div>
        <div class="unit">${unit}${i.r>0?` · 余 ¥${i.r.toLocaleString()}`:''}</div>
      </div>
    </div>
  `;}).join('');
}

function addCustom() {
  const n = document.getElementById('cName').value.trim();
  const e = document.getElementById('cEmoji').value.trim() || '💜';
  const p = parseFloat(document.getElementById('cPrice').value);
  if(!n || isNaN(p) || p<=0) return;
  customItems.push({ n, e, p });
  document.getElementById('cName').value = '';
  document.getElementById('cEmoji').value = '';
  document.getElementById('cPrice').value = '';
  renderCList();
  if(currentAmount>0) { renderFilter(); renderList(currentFilter); }
}

function removeCustom(i) {
  customItems.splice(i,1);
  renderCList();
  if(currentAmount>0) { renderFilter(); renderList(currentFilter); }
}

function renderCList() {
  const el = document.getElementById('customList');
  if(!customItems.length) { el.innerHTML = '<div style="font-size:13px;color:var(--text-tertiary);padding:8px 0;">还没有添加。</div>'; return; }
  el.innerHTML = customItems.map((ci,i) => `
    <div class="custom-row">
      <span>${ci.e} ${ci.n} · ¥${ci.p.toLocaleString()}</span>
      <button class="del" onclick="removeCustom(${i})">×</button>
    </div>
  `).join('');
}

renderCList();
